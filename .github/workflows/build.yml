name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (NDK, CMake, platform 36)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Build offline debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleOfflineDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-offline-debug
          path: app/build/outputs/apk/offline/debug/*.apk
          if-no-files-found: error
